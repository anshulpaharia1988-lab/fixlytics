<body>
  <template id="__bundler_thumbnail" data-bg-color="#f8faf9">

      <rect width="1200" height="800" fill="#f8faf9"/>
      <!-- soft green halo -->
      <ellipse cx="600" cy="180" rx="520" ry="240" fill="#00c758" opacity="0.10"/>
      <!-- dot grid -->
      <g fill="#0a1628" opacity="0.08">
        <circle cx="300" cy="180" r="3"/><circle cx="380" cy="180" r="3"/><circle cx="460" cy="180" r="3"/>
        <circle cx="540" cy="180" r="3"/><circle cx="620" cy="180" r="3"/><circle cx="700" cy="180" r="3"/>

        <circle cx="780" cy="260" r="3"/><circle cx="860" cy="260" r="3"/><circle cx="940" cy="260" r="3"/>

      <!-- Pagecheck mark -->
      <g transform="translate(540 320)">
        <rect width="120" height="120" rx="28" fill="#0a1628"/>
        <rect x="32" y="32" width="56" height="56" rx="12" fill="url(#g)"/>

            <stop offset="0%" stop-color="#7bf1a8"/>
            <stop offset="100%" stop-color="#00a544"/>

        </defs>
      </g>
      <!-- title -->
      <text x="600" y="510" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="800" font-size="64" letter-spacing="-2" fill="#0a1628">Pagecheck</text>
      <text x="600" y="558" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-weight="500" font-size="22" fill="#6b7280">Loading audit&hellip;</text>
      <!-- progress bar -->
      <rect x="500" y="600" width="200" height="6" rx="3" fill="#e5e7eb"/>
      <rect x="500" y="600" width="120" height="6" rx="3" fill="#00c758"/>
    </svg>
